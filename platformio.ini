[platformio]
src_dir = esp32
default_envs = feather_s3

[env:feather_s3]
platform = espressif32 @ 6.10.0
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
upload_port = COM4

